<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>观海会</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800;900&family=Rajdhani:wght@300;400;500;700&display=swap" rel="stylesheet">
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
    <style>
        :root {
            --cyber-cyan: #00f0ff;
            --cyber-blue: #0066ff;
            --bg-dark: #050510;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html,
        body {
            overflow: hidden;
            background: var(--bg-dark);
            font-family: 'Rajdhani', 'Orbitron', sans-serif;
            height: 100%;
            width: 100%;
            cursor: crosshair;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        canvas {
            display: block;
        }
        .main-title {
            position: fixed;
            top: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            pointer-events: none;
            text-align: center;
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            font-size: clamp(1.8rem, 4.5vw, 3rem);
            letter-spacing: 0.15em;
            color: #fff;
            text-shadow: 0 0 20px rgba(0, 240, 255, 0.8),
                0 0 40px rgba(0, 240, 255, 0.4),
                0 0 80px rgba(0, 240, 255, 0.2);
            animation: titleGlow 3s ease-in-out infinite;
        }
        .main-title .sub {
            display: block;
            font-size: 0.4em;
            letter-spacing: 0.4em;
            font-weight: 400;
            color: #00f0ff;
            margin-top: 6px;
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.9);
        }
        @keyframes titleGlow {
            0%,
            100% {
                text-shadow: 0 0 20px rgba(0, 240, 255, 0.8),
                    0 0 40px rgba(0, 240, 255, 0.4),
                    0 0 80px rgba(0, 240, 255, 0.2);
            }
            50% {
                text-shadow: 0 0 30px rgba(0, 240, 255, 1),
                    0 0 60px rgba(0, 240, 255, 0.6),
                    0 0 100px rgba(0, 240, 255, 0.4);
            }
        }
        @media (max-width: 768px) {
            .main-title {
                top: 20px;
                font-size: clamp(1.4rem, 6vw, 2rem);
            }
        }
    </style>
</head>
<body>

    <div class="main-title">
        GLOBAL SURVEILLANCE
    </div>

    <div id="canvas-container"></div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // ============ 场景初始化 ============
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x050510);
        scene.fog = new THREE.FogExp2(0x050510, 0.012);

        // 🔥 调整相机：拉远距离，确保左右可见；地球下移避开标题
        const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(0, -0.1, 2.0);   // 距离2.0，水平方向约占75-85%

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2;
        container.appendChild(renderer.domElement);

        // ============ OrbitControls ============
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.06;
        controls.autoRotate = true;
        controls.autoRotateSpeed = 0.5;
        controls.minDistance = 1.2;
        controls.maxDistance = 3.0;
        controls.enablePan = false;
        controls.rotateSpeed = 0.5;
        controls.zoomSpeed = 0.8;
        controls.target.set(0, -0.4, 0);   // 目标点与地球中心对齐（地球下移0.4）

        // ============ 光照 ============
        const ambientLight = new THREE.AmbientLight(0x1a1a3a, 1.8);
        scene.add(ambientLight);
        const sunLight = new THREE.DirectionalLight(0xffeedd, 2.8);
        sunLight.position.set(5, 2, 4);
        scene.add(sunLight);
        const rimLight = new THREE.DirectionalLight(0x0088ff, 1.2);
        rimLight.position.set(-3, -1, -2);
        scene.add(rimLight);
        const pointLight = new THREE.PointLight(0x00f0ff, 2.5, 5);
        pointLight.position.set(0, 0, 0);
        scene.add(pointLight);

        // ============ 纹理工具 ============
        function createGlowTexture(r, g, b, size = 128, innerRadius = 0.1, outerRadius = 0.45) {
            const canvas = document.createElement('canvas');
            canvas.width = size;
            canvas.height = size;
            const ctx = canvas.getContext('2d');
            const center = size / 2;
            const gradient = ctx.createRadialGradient(center, center, 0, center, center, center);
            gradient.addColorStop(0, `rgba(${r},${g},${b},1)`);
            gradient.addColorStop(innerRadius, `rgba(${r},${g},${b},1)`);
            gradient.addColorStop(outerRadius, `rgba(${r},${g},${b},0.4)`);
            gradient.addColorStop(1, 'rgba(0,0,0,0)');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, size, size);
            return new THREE.CanvasTexture(canvas);
        }

        function createRingTexture(r, g, b, size = 128) {
            const canvas = document.createElement('canvas');
            canvas.width = size;
            canvas.height = size;
            const ctx = canvas.getContext('2d');
            const center = size / 2;
            const gradient = ctx.createRadialGradient(center, center, 0, center, center, center);
            gradient.addColorStop(0, 'rgba(0,0,0,0)');
            gradient.addColorStop(0.55, 'rgba(0,0,0,0)');
            gradient.addColorStop(0.65, `rgba(${r},${g},${b},1)`);
            gradient.addColorStop(0.75, `rgba(${r},${g},${b},0.5)`);
            gradient.addColorStop(1, 'rgba(0,0,0,0)');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, size, size);
            return new THREE.CanvasTexture(canvas);
        }

        function createStarTexture(size = 64) {
            const canvas = document.createElement('canvas');
            canvas.width = size;
            canvas.height = size;
            const ctx = canvas.getContext('2d');
            const center = size / 2;
            const gradient = ctx.createRadialGradient(center, center, 0, center, center, center);
            gradient.addColorStop(0, 'rgba(255,255,255,1)');
            gradient.addColorStop(0.2, 'rgba(255,255,255,0.6)');
            gradient.addColorStop(0.5, 'rgba(200,220,255,0.2)');
            gradient.addColorStop(1, 'rgba(0,0,0,0)');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, size, size);
            return new THREE.CanvasTexture(canvas);
        }

        function generateFallbackTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 1024;
            canvas.height = 512;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#0a1a3a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.strokeStyle = 'rgba(0, 200, 255, 0.3)';
            ctx.lineWidth = 2;
            for (let i = 0; i < 36; i++) {
                ctx.beginPath();
                ctx.moveTo(i * (canvas.width / 36), 0);
                ctx.lineTo(i * (canvas.width / 36), canvas.height);
                ctx.stroke();
            }
            for (let i = 0; i < 18; i++) {
                ctx.beginPath();
                ctx.moveTo(0, i * (canvas.height / 18));
                ctx.lineTo(canvas.width, i * (canvas.height / 18));
                ctx.stroke();
            }
            ctx.fillStyle = '#1a4a6a';
            ctx.beginPath();
            ctx.ellipse(0.55*canvas.width, 0.38*canvas.height, 0.11*canvas.width, 0.09*canvas.height, 0, 0, Math.PI*2);
            ctx.fill();
            ctx.fillStyle = '#1e5070';
            ctx.beginPath();
            ctx.ellipse(0.68*canvas.width, 0.42*canvas.height, 0.12*canvas.width, 0.11*canvas.height, 0, 0, Math.PI*2);
            ctx.fill();
            const texture = new THREE.CanvasTexture(canvas);
            texture.colorSpace = THREE.SRGBColorSpace;
            return texture;
        }

        // ============ 地球 ============
        const earthRadius = 1;
        const earthGroup = new THREE.Group();
        earthGroup.position.y = -0.4;   // 🔥 地球整体下移，确保位于标题下方
        scene.add(earthGroup);

        const earthGeometry = new THREE.SphereGeometry(earthRadius, 96, 96);
        const earthMaterial = new THREE.MeshStandardMaterial({
            map: generateFallbackTexture(),
            roughness: 0.5,
            metalness: 0.1,
            emissive: new THREE.Color(0x0a1a3a),
            emissiveIntensity: 0.3,
        });
        const earthMesh = new THREE.Mesh(earthGeometry, earthMaterial);
        earthGroup.add(earthMesh);

        // 加载真实纹理
        const textureLoader = new THREE.TextureLoader();
        textureLoader.setCrossOrigin('anonymous');
        const realTextureURLs = [
            'https://threejs.org/examples/textures/planets/earth_atmos_2048.jpg',
            'https://unpkg.com/three-globe@2.31.0/example/img/earth-blue-marble.jpg',
            'https://unpkg.com/three-globe@2.31.0/example/img/earth-dark.jpg'
        ];
        let textureLoadIndex = 0;
        function tryLoadRealTexture() {
            if (textureLoadIndex >= realTextureURLs.length) return;
            const url = realTextureURLs[textureLoadIndex];
            textureLoader.load(
                url,
                (texture) => {
                    texture.colorSpace = THREE.SRGBColorSpace;
                    earthMaterial.map = texture;
                    earthMaterial.emissiveIntensity = 0.15;
                    earthMaterial.needsUpdate = true;
                },
                undefined,
                () => {
                    textureLoadIndex++;
                    tryLoadRealTexture();
                }
            );
        }
        tryLoadRealTexture();

        // 线框叠加
        const wireframeGeometry = new THREE.SphereGeometry(earthRadius * 1.005, 48, 36);
        const wireframeMaterial = new THREE.MeshBasicMaterial({
            color: 0x00f0ff,
            wireframe: true,
            transparent: true,
            opacity: 0.06,
            depthWrite: false,
        });
        const wireframeMesh = new THREE.Mesh(wireframeGeometry, wireframeMaterial);
        earthGroup.add(wireframeMesh);

        // 大气层光晕（外）
        const atmosphereGeometry = new THREE.SphereGeometry(earthRadius * 1.08, 64, 64);
        const atmosphereMaterial = new THREE.ShaderMaterial({
            vertexShader: `varying vec3 vNormal; varying vec3 vPosition; void main() { vNormal = normalize(normalMatrix * normal); vPosition = (modelViewMatrix * vec4(position, 1.0)).xyz; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
            fragmentShader: `varying vec3 vNormal; varying vec3 vPosition; uniform vec3 glowColor; uniform float intensity; void main() { float rim = 1.0 - abs(dot(normalize(vNormal), normalize(vPosition))); rim = pow(rim, 3.5); float alpha = rim * intensity; gl_FragColor = vec4(glowColor, alpha); }`,
            uniforms: { glowColor: { value: new THREE.Color(0x00aaff) }, intensity: { value: 1.8 } },
            transparent: true, side: THREE.BackSide, depthWrite: false, blending: THREE.AdditiveBlending,
        });
        const atmosphereMesh = new THREE.Mesh(atmosphereGeometry, atmosphereMaterial);
        earthGroup.add(atmosphereMesh);

        // 大气层光晕（内）
        const innerAtmoGeometry = new THREE.SphereGeometry(earthRadius * 1.03, 64, 64);
        const innerAtmoMaterial = new THREE.ShaderMaterial({
            vertexShader: `varying vec3 vNormal; varying vec3 vPosition; void main() { vNormal = normalize(normalMatrix * normal); vPosition = (modelViewMatrix * vec4(position, 1.0)).xyz; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
            fragmentShader: `varying vec3 vNormal; varying vec3 vPosition; uniform vec3 glowColor; uniform float intensity; void main() { float rim = 1.0 - abs(dot(normalize(vNormal), normalize(vPosition))); rim = pow(rim, 4.0); float alpha = rim * intensity * 0.7; gl_FragColor = vec4(glowColor, alpha); }`,
            uniforms: { glowColor: { value: new THREE.Color(0x00f0ff) }, intensity: { value: 1.2 } },
            transparent: true, side: THREE.FrontSide, depthWrite: false, blending: THREE.AdditiveBlending,
        });
        const innerAtmoMesh = new THREE.Mesh(innerAtmoGeometry, innerAtmoMaterial);
        earthGroup.add(innerAtmoMesh);

        // ============ 城市坐标与标记点（尺寸已显著缩小） ============
        const citiesData = [
            { name: '北京', lat: 39.9, lon: 116.4, color: '#ff3344', type: 'core' },
            { name: '上海', lat: 31.2, lon: 121.5, color: '#00f0ff', type: 'node' },
            { name: '纽约', lat: 40.7, lon: -74.0, color: '#ff3344', type: 'core' },
            { name: '伦敦', lat: 51.5, lon: -0.1, color: '#ff3344', type: 'core' },
            { name: '东京', lat: 35.7, lon: 139.7, color: '#00f0ff', type: 'node' },
            { name: '悉尼', lat: -33.9, lon: 151.2, color: '#00ff88', type: 'node' },
            { name: '巴黎', lat: 48.9, lon: 2.4, color: '#00ff88', type: 'node' },
            { name: '莫斯科', lat: 55.8, lon: 37.6, color: '#ff8800', type: 'strategic' },
            { name: '迪拜', lat: 25.2, lon: 55.3, color: '#ff8800', type: 'strategic' },
            { name: '新加坡', lat: 1.35, lon: 103.8, color: '#00f0ff', type: 'node' },
            { name: '香港', lat: 22.3, lon: 114.2, color: '#00f0ff', type: 'node' },
            { name: '洛杉矶', lat: 34.05, lon: -118.2, color: '#00ff88', type: 'node' },
            { name: '开普敦', lat: -33.9, lon: 18.4, color: '#00ff88', type: 'node' },
            { name: '里约', lat: -22.9, lon: -43.2, color: '#00ff88', type: 'node' },
        ];

        function latLonToPosition(lat, lon, radius) {
            const phi = (90 - lat) * Math.PI / 180;
            const theta = (lon + 180) * Math.PI / 180;
            const x = -radius * Math.sin(phi) * Math.cos(theta);
            const y = radius * Math.cos(phi);
            const z = radius * Math.sin(phi) * Math.sin(theta);
            return new THREE.Vector3(x, y, z);
        }

        const markersGroup = new THREE.Group();
        earthGroup.add(markersGroup);
        const markerMeshes = [];
        const markerDataMap = new Map();
        const pulseSprites = [];
        const glowTextureCache = {};
        const ringTextureCache = {};

        function getGlowTexture(hexColor) {
            if (!glowTextureCache[hexColor]) {
                const r = parseInt(hexColor.slice(1, 3), 16);
                const g = parseInt(hexColor.slice(3, 5), 16);
                const b = parseInt(hexColor.slice(5, 7), 16);
                glowTextureCache[hexColor] = createGlowTexture(r, g, b);
            }
            return glowTextureCache[hexColor];
        }

        function getRingTexture(hexColor) {
            if (!ringTextureCache[hexColor]) {
                const r = parseInt(hexColor.slice(1, 3), 16);
                const g = parseInt(hexColor.slice(3, 5), 16);
                const b = parseInt(hexColor.slice(5, 7), 16);
                ringTextureCache[hexColor] = createRingTexture(r, g, b);
            }
            return ringTextureCache[hexColor];
        }

        citiesData.forEach((city, index) => {
            const pos = latLonToPosition(city.lat, city.lon, earthRadius * 1.02);
            const group = new THREE.Group();
            group.position.copy(pos);
            const outward = pos.clone().normalize();
            group.lookAt(outward.clone().multiplyScalar(2));
            group.rotateX(Math.PI / 2);
            const colorObj = new THREE.Color(city.color);
            // 核心球体半径很小
            const coreRadius = city.type === 'core' ? 0.014 : city.type === 'strategic' ? 0.012 : 0.010;
            const coreGeometry = new THREE.SphereGeometry(coreRadius, 16, 16);
            const coreMaterial = new THREE.MeshBasicMaterial({ color: colorObj, transparent: true, opacity: 0.95 });
            const coreMesh = new THREE.Mesh(coreGeometry, coreMaterial);
            coreMesh.userData.cityIndex = index;
            coreMesh.userData.originalColor = city.color;
            group.add(coreMesh);
            markerMeshes.push(coreMesh);
            markerDataMap.set(coreMesh, city);

            // 光晕缩小
            const glowSpriteMat = new THREE.SpriteMaterial({ map: getGlowTexture(city.color), color: colorObj, transparent: true, opacity: 0.85, blending: THREE.AdditiveBlending, depthWrite: false });
            const glowSprite = new THREE.Sprite(glowSpriteMat);
            glowSprite.scale.set(0.08, 0.08, 1);
            group.add(glowSprite);

            // 脉冲环缩小
            for (let p = 0; p < 2; p++) {
                const pulseMat = new THREE.SpriteMaterial({ map: getRingTexture(city.color), color: colorObj, transparent: true, opacity: 0, blending: THREE.AdditiveBlending, depthWrite: false });
                const pulseSprite = new THREE.Sprite(pulseMat);
                pulseSprite.scale.set(0.03, 0.03, 1);
                pulseSprite.userData.phase = p * 0.5;
                pulseSprite.userData.speed = 0.8 + Math.random() * 0.6;
                pulseSprite.userData.baseScale = 0.025 + Math.random() * 0.035;
                group.add(pulseSprite);
                pulseSprites.push(pulseSprite);
            }
            markersGroup.add(group);
        });

        // ============ 弧线连接 ============
        const arcsGroup = new THREE.Group();
        earthGroup.add(arcsGroup);
        const arcFlowingSprites = [];
        const cityPosMap = new Map();
        citiesData.forEach(city => cityPosMap.set(city.name, latLonToPosition(city.lat, city.lon, earthRadius * 1.02)));
        const connections = [
            ['北京', '纽约'], ['北京', '伦敦'], ['北京', '莫斯科'], ['北京', '迪拜'],
            ['北京', '新加坡'], ['上海', '东京'], ['上海', '新加坡'], ['上海', '香港'],
            ['纽约', '伦敦'], ['纽约', '洛杉矶'], ['东京', '洛杉矶'], ['莫斯科', '迪拜'],
            ['伦敦', '巴黎'], ['新加坡', '悉尼'], ['迪拜', '开普敦'], ['里约', '纽约'],
        ];
        connections.forEach(([cityA, cityB]) => {
            const start = cityPosMap.get(cityA);
            const end = cityPosMap.get(cityB);
            if (!start || !end) return;
            const mid = new THREE.Vector3().addVectors(start, end).multiplyScalar(0.5);
            const dist = start.distanceTo(end);
            const arcHeight = earthRadius + dist * 0.45;
            mid.normalize().multiplyScalar(arcHeight);
            const curve = new THREE.QuadraticBezierCurve3(start.clone(), mid, end.clone());
            const curvePoints = curve.getPoints(50);
            const curveGeometry = new THREE.BufferGeometry().setFromPoints(curvePoints);
            const lineMat = new THREE.LineBasicMaterial({ color: 0x00f0ff, transparent: true, opacity: 0.35, blending: THREE.AdditiveBlending, depthWrite: false });
            const arcLine = new THREE.Line(curveGeometry, lineMat);
            arcsGroup.add(arcLine);
            for (let f = 0; f < 2; f++) {
                const flowMat = new THREE.SpriteMaterial({ map: createGlowTexture(0, 255, 255, 64, 0.1, 0.4), color: 0x00ffff, transparent: true, opacity: 0.9, blending: THREE.AdditiveBlending, depthWrite: false });
                const flowSprite = new THREE.Sprite(flowMat);
                flowSprite.scale.set(0.04, 0.04, 1);
                flowSprite.userData.curve = curve;
                flowSprite.userData.t = f * 0.5;
                flowSprite.userData.speed = 0.15 + Math.random() * 0.2;
                arcsGroup.add(flowSprite);
                arcFlowingSprites.push(flowSprite);
            }
        });

        // ============ 粒子环（装饰） ============
        const particlesRingGroup = new THREE.Group();
        scene.add(particlesRingGroup);
        function createParticleRing(radius, tiltX, tiltZ, count, color, size, opacity) {
            const positions = new Float32Array(count * 3);
            const colors = new Float32Array(count * 3);
            const colorObj = new THREE.Color(color);
            for (let i = 0; i < count; i++) {
                const angle = (i / count) * Math.PI * 2;
                const x = radius * Math.cos(angle);
                const y = radius * Math.sin(angle) * 0.15 + (Math.random() - 0.5) * 0.08;
                const z = radius * Math.sin(angle) * 0.35;
                positions[i * 3] = x;
                positions[i * 3 + 1] = y;
                positions[i * 3 + 2] = z;
                const brightness = 0.5 + Math.random() * 0.5;
                colors[i * 3] = colorObj.r * brightness;
                colors[i * 3 + 1] = colorObj.g * brightness;
                colors[i * 3 + 2] = colorObj.b * brightness;
            }
            const geometry = new THREE.BufferGeometry();
            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
            const material = new THREE.PointsMaterial({ size: size, vertexColors: true, transparent: true, opacity: opacity, blending: THREE.AdditiveBlending, depthWrite: false, map: createStarTexture(32), sizeAttenuation: true });
            const ring = new THREE.Points(geometry, material);
            ring.rotation.x = tiltX;
            ring.rotation.z = tiltZ;
            return ring;
        }
        const ring1 = createParticleRing(1.6, Math.PI / 3, 0.1, 1800, '#00f0ff', 0.02, 0.5);
        const ring2 = createParticleRing(1.9, Math.PI / 2.2, 0.25, 1500, '#0088ff', 0.017, 0.4);
        const ring3 = createParticleRing(1.4, Math.PI / 1.8, -0.15, 1200, '#00ffff', 0.014, 0.35);
        const ring4 = createParticleRing(2.2, Math.PI / 4, 0.4, 800, '#0066aa', 0.022, 0.25);
        particlesRingGroup.add(ring1, ring2, ring3, ring4);

        // ============ 星空 ============
        const starsGeometry = new THREE.BufferGeometry();
        const starsCount = 2500;
        const starPositions = new Float32Array(starsCount * 3);
        const starColors = new Float32Array(starsCount * 3);
        for (let i = 0; i < starsCount; i++) {
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos(2 * Math.random() - 1);
            const radius = 8 + Math.random() * 18;
            starPositions[i * 3] = radius * Math.sin(phi) * Math.cos(theta);
            starPositions[i * 3 + 1] = radius * Math.cos(phi);
            starPositions[i * 3 + 2] = radius * Math.sin(phi) * Math.sin(theta);
            const brightness = 0.4 + Math.random() * 0.6;
            const tint = Math.random();
            if (tint > 0.8) { starColors[i*3]=brightness; starColors[i*3+1]=brightness*0.85; starColors[i*3+2]=brightness*0.7; }
            else if (tint > 0.6) { starColors[i*3]=brightness*0.75; starColors[i*3+1]=brightness*0.85; starColors[i*3+2]=brightness; }
            else { starColors[i*3]=brightness; starColors[i*3+1]=brightness; starColors[i*3+2]=brightness; }
        }
        starsGeometry.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
        starsGeometry.setAttribute('color', new THREE.BufferAttribute(starColors, 3));
        const starsMaterial = new THREE.PointsMaterial({ size: 0.025, vertexColors: true, transparent: true, opacity: 0.9, blending: THREE.AdditiveBlending, depthWrite: false, map: createStarTexture(32), sizeAttenuation: true });
        const stars = new THREE.Points(starsGeometry, starsMaterial);
        scene.add(stars);

        // ============ 交互（点击高亮标记点） ============
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        let selectedMarker = null;
        let hoveredMarker = null;

        function getIntersection(clientX, clientY) {
            const rect = renderer.domElement.getBoundingClientRect();
            mouse.x = ((clientX - rect.left) / rect.width) * 2 - 1;
            mouse.y = -((clientY - rect.top) / rect.height) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects([...markerMeshes, earthMesh], false);
            if (intersects.length > 0) {
                const first = intersects[0];
                if (markerMeshes.includes(first.object)) return first.object;
            }
            return null;
        }

        function highlightMarker(mesh, highlight) {
            if (!mesh) return;
            const city = markerDataMap.get(mesh);
            if (highlight) {
                mesh.material.color.set(0xffffff);
                mesh.material.opacity = 1;
                mesh.scale.set(2.2, 2.2, 2.2);
                document.body.style.cursor = 'pointer';
            } else {
                const colorHex = city ? city.color : '#00f0ff';
                mesh.material.color.set(colorHex);
                mesh.material.opacity = 0.95;
                mesh.scale.set(1, 1, 1);
                document.body.style.cursor = 'crosshair';
            }
        }

        renderer.domElement.addEventListener('click', (event) => {
            const marker = getIntersection(event.clientX, event.clientY);
            if (marker) {
                if (selectedMarker && selectedMarker !== marker) highlightMarker(selectedMarker, false);
                selectedMarker = marker;
                highlightMarker(marker, true);
                if (marker._resetTimeout) clearTimeout(marker._resetTimeout);
                marker._resetTimeout = setTimeout(() => { if (selectedMarker === marker) { highlightMarker(marker, false); selectedMarker = null; } }, 2500);
            } else {
                if (selectedMarker) { highlightMarker(selectedMarker, false); selectedMarker = null; }
            }
        });

        renderer.domElement.addEventListener('mousemove', (event) => {
            const marker = getIntersection(event.clientX, event.clientY);
            if (marker !== hoveredMarker) {
                if (hoveredMarker && hoveredMarker !== selectedMarker) highlightMarker(hoveredMarker, false);
                hoveredMarker = marker;
                if (hoveredMarker && hoveredMarker !== selectedMarker) highlightMarker(hoveredMarker, true);
                if (!hoveredMarker) document.body.style.cursor = 'crosshair';
            }
        });

        renderer.domElement.addEventListener('touchstart', (event) => {
            if (event.touches.length === 1) {
                const touch = event.touches[0];
                const marker = getIntersection(touch.clientX, touch.clientY);
                if (marker) {
                    if (selectedMarker && selectedMarker !== marker) highlightMarker(selectedMarker, false);
                    selectedMarker = marker;
                    highlightMarker(marker, true);
                    if (marker._resetTimeout) clearTimeout(marker._resetTimeout);
                    marker._resetTimeout = setTimeout(() => { if (selectedMarker === marker) { highlightMarker(marker, false); selectedMarker = null; } }, 2500);
                }
            }
        }, { passive: true });

        // ============ 动画循环 ============
        const clock = new THREE.Clock();
        let elapsedTime = 0;
        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();
            elapsedTime += delta;
            earthGroup.rotation.y += delta * 0.1;
            particlesRingGroup.rotation.y += delta * 0.08;
            particlesRingGroup.rotation.x += delta * 0.03;
            stars.rotation.y += delta * 0.01;
            stars.rotation.x += delta * 0.005;
            controls.update();
            pulseSprites.forEach(sprite => {
                const phase = sprite.userData.phase;
                const speed = sprite.userData.speed;
                const baseScale = sprite.userData.baseScale;
                const t = ((elapsedTime * speed + phase) % 1);
                const scale = baseScale + t * 0.2;
                sprite.scale.set(scale, scale, 1);
                sprite.material.opacity = (1 - t) * 0.7;
            });
            arcFlowingSprites.forEach(sprite => {
                const curve = sprite.userData.curve;
                const speed = sprite.userData.speed;
                sprite.userData.t += delta * speed;
                if (sprite.userData.t > 1) sprite.userData.t -= 1;
                const point = curve.getPoint(sprite.userData.t);
                sprite.position.copy(point);
                sprite.material.opacity = 0.5 + Math.sin(sprite.userData.t * Math.PI * 4) * 0.4;
            });
            renderer.render(scene, camera);
        }

        // ============ 响应式 ============
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // ============ 启动 ============
        animate();
        console.log('🌐 全球数据监测中心已启动 — 拖拽旋转地球，点击发光节点');
    </script>
</body>
</html>
